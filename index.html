<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>발표자료</title>
<link rel="stylesheet" href="_shared/theme/tokens.css">
<style>
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 500 16px/1.6 'Pretendard', -apple-system, sans-serif;
    letter-spacing: -0.01em;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 72px 24px 96px; }
  h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em; }
  .sub { margin: 6px 0 0; font-size: 14px; font-weight: 400; color: var(--muted); }
  hr { border: none; border-top: 1px solid var(--rule); margin: 22px 0 0; }

  h2.year {
    margin: 34px 0 0; font-size: 13px; font-weight: 700;
    letter-spacing: .12em; color: var(--brand-crimson);
  }
  ul { list-style: none; margin: 6px 0 0; padding: 0; }
  li { border-bottom: 1px solid #E8E8E8; }
  a.row {
    display: flex; align-items: baseline; gap: 12px;
    padding: 16px 2px; text-decoration: none; color: var(--ink);
  }
  a.row:hover .name { color: var(--accent-blue); }
  .date { flex: 0 0 84px; font-size: 13px; font-weight: 400; color: var(--muted);
          font-variant-numeric: tabular-nums; }
  .name { flex: 1 1 auto; font-size: 16px; font-weight: 500; }
  .event { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); }
  .kind {
    flex: 0 0 auto; font-size: 11px; font-weight: 500;
    color: var(--muted); border: 1px solid #DDD; padding: 3px 7px; border-radius: 3px;
  }
  /* 공개 표식 — 무엇이 밖으로 나가는지 목록에서 바로 보여야 한다 */
  .pub {
    flex: 0 0 auto; font-size: 11px; font-weight: 500;
    padding: 3px 7px; border-radius: 3px;
    color: #FFF; background: var(--accent-green);
  }
  .pub.locked { color: var(--muted); background: none; border: 1px solid #DDD; }

  /* 로그아웃 — Cloudflare Access 세션을 지운다. Access 뒤가 아니면 아래 스크립트가 감춘다. */
  .signout { margin: 40px 0 0; font-size: 13px; }
  .signout a { color: var(--muted); text-decoration: none; }
  .signout a:hover { color: var(--accent-red); }
</style>
</head>
<body>
<div class="wrap">
  <h1>발표자료</h1>
  <p class="sub">권규상 · 충북대학교 도시공학과</p>
  <hr>
  <div id="list"></div>
  <p class="signout" id="signout" hidden>
    <a href="/cdn-cgi/access/logout">로그아웃</a></p>
</div>

<script>
// 새 발표를 만들면 이 배열에 폴더명을 추가한다. 수동 등록 지점은 여기 한 곳뿐이다.
// (talk.json 은 있는데 여기 없으면 사이트에 안 뜬다 — check-links.sh 가 경고한다)
const TALKS = ['2025-09-08_UESA연구실세미나_논문작성법과연구윤리'];

(async function () {
  const box = document.getElementById('list');
  const rows = [];

  for (const dir of TALKS) {
    let t;
    try { t = await (await fetch(dir + '/talk.json')).json(); }
    catch (e) { console.warn('talk.json 없음:', dir); continue; }
    rows.push({ dir, t });
  }

  // 최신 발표가 위로. 폴더명이 YYYY-MM-DD 로 시작하므로 문자열 정렬이 곧 날짜 정렬이다.
  rows.sort((a, b) => b.dir.localeCompare(a.dir));

  let year = null;
  let ul = null;
  for (const { dir, t } of rows) {
    const y = dir.slice(0, 4);
    if (y !== year) {
      year = y;
      const h = document.createElement('h2');
      h.className = 'year';
      h.textContent = y;
      ul = document.createElement('ul');
      box.append(h, ul);
    }

    // 첫 번째 완료된 덱으로 바로 들어간다. 없으면 발표 안내 페이지로.
    const deck = (t.decks || []).find((d) => d.status === 'done' && d.file);

    const li = document.createElement('li');
    const a = document.createElement('a');
    a.className = 'row';
    a.href = dir + '/index.html';

    const date = document.createElement('span');
    date.className = 'date';
    date.textContent = (t.date || '').replace(/\s/g, '');

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = t.title || dir;
    const ev = document.createElement('span');
    ev.className = 'event';
    ev.textContent = [t.event, t.venue].filter(Boolean).join(' · ');
    name.append(ev);

    a.append(date, name);

    if (t.kind) {
      const k = document.createElement('span');
      k.className = 'kind';
      k.textContent = t.kind;
      a.append(k);
    }

    const p = document.createElement('span');
    p.className = 'pub' + (t.public === true ? '' : ' locked');
    p.textContent = t.public === true ? '공개' : '비공개';
    a.append(p);

    if (!deck) {
      const tag = document.createElement('span');
      tag.className = 'kind';
      tag.textContent = '준비 중';
      a.append(tag);
    }

    li.append(a);
    ul.append(li);
  }

  // 로그아웃 링크는 Access 뒤에 있을 때만 보인다.
  try {
    const r = await fetch('/cdn-cgi/access/get-identity');
    if (r.ok) document.getElementById('signout').hidden = false;
  } catch (e) { /* Access 가 없는 곳 — 그냥 감춰 둔다 */ }
})();
</script>
</body>
</html>
