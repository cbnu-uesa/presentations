<!doctype html>
<!--
  발표 슬라이드 스캐폴드 — 이 파일을 <발표폴더>/slides/deck.html 로 복사해 시작한다.
  경로는 slides/ 안에 있다고 가정한 상대경로다.

  · 슬라이드 유형과 색·치수는 design.md 를 따른다.
  · 행사명·날짜·발표자·푸터 문구는 여기 쓰지 않는다. ../talk.json 에서 자동으로 들어온다.
  · 테마는 강의 넷 + talk.css 다섯이며 읽는 순서가 곧 덮어쓰는 순서다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발표 제목</title>

  <link rel="stylesheet" href="../../_shared/vendor/reveal/reset.css">
  <link rel="stylesheet" href="../../_shared/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="../../_shared/theme/tokens.css">
  <link rel="stylesheet" href="../../_shared/theme/cbnu.css">
  <link rel="stylesheet" href="../../_shared/theme/components.css">
  <link rel="stylesheet" href="../../_shared/theme/print.css">
  <link rel="stylesheet" href="../../_shared/theme/talk.css">

  <!-- 본문의 Fig.draw() 인라인 스크립트보다 먼저 로드되어야 한다 -->
  <script src="../../_shared/js/charts.js"></script>
</head>
<body>
<div class="reveal"><div class="slides">

  <!-- T1 표지 — 네 자리 모두 talk.json 이 채운다 -->
  <section class="s-cover">
    <div class="logo-row">
      <img class="cover-logo" src="../../_shared/img/cbnu-logo.jpg" alt="충북대학교">
      <!-- 주최 기관 마크가 필요하면 여기 <img> 를 하나 더 둔다 (assets/ 에 넣는다) -->
    </div>
    <p class="cover-event" data-talk-event>&nbsp;</p>
    <h1>발표 제목</h1>
    <p class="cover-byline" data-talk-byline>&nbsp;</p>
    <p class="cover-date" data-talk-date>&nbsp;</p>
  </section>

  <!-- T12 섹션 구분 -->
  <section class="s-section">
    <h2>1. 문제</h2>
  </section>

  <!-- T3 정의 -->
  <section>
    <h2>슬라이드 제목</h2>
    <div class="body stack">
      <p class="lead t-define">한 줄로 정리되는 핵심 문장을 여기 둔다.</p>
    </div>
  </section>

  <!-- T4 개념 + 그래프 2단 -->
  <section class="s-split">
    <h2>슬라이드 제목</h2>
    <div class="body">
      <div class="col-l">
        <p class="caption-blue">표·그림 캡션</p>
        <!-- 표나 설명 -->
      </div>
      <div class="col-r">
        <svg class="fig" id="fig-1" viewBox="0 0 440 300" role="img">
          <title>무엇을 그린 그림인지 적는다</title>
        </svg>
        <script>
          Fig.draw('#fig-1', {
            axes: { x: '가로축 이름', y: '세로축 이름' },
            parts: [
              Fig.curve(Fig.convex()),
            ],
          });
        </script>
      </div>
    </div>
  </section>

  <!-- T10 마무리 -->
  <section class="s-closing">
    <h2>감사합니다</h2>
    <p class="contact">권규상 · 충북대학교 도시공학과</p>
  </section>

</div></div>

<script src="../../_shared/vendor/reveal/reveal.js"></script>
<script src="../../_shared/vendor/reveal/plugin/notes.js"></script>
<script src="../../_shared/vendor/reveal/plugin/math.js"></script>
<script src="../../_shared/js/talk-init.js"></script>
</body>
</html>
